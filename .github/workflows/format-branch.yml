name: Temporary branch formatter
on:
  push:
    branches: [arena/01a105f2-lex-browser]
permissions:
  contents: write
jobs:
  format:
    if: github.event.head_commit.message != 'Apply rustfmt to M7 implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a105f2-lex-browser
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply rustfmt to M7 implementation'
          git push origin HEAD:arena/01a105f2-lex-browser
